name: release

# Push a tag vX.Y.Z (equal to package.json "version") to publish that version of @zebracat/sdk to npm.
#
# npm Trusted Publishing: GitHub's OIDC token proves this workflow is the publisher, so no npm token or one-time
# password is stored anywhere, and npm adds a provenance statement. One-time setup on npmjs.com:
#   @zebracat/sdk -> Settings -> Trusted Publisher -> GitHub Actions,
#   organization "zebracatai", repository "zebracat-node", workflow "release.yml".

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run generate:check
      - run: npm run typecheck
      - run: npm test

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - name: Package version must match the tag
        run: |
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $GITHUB_REF_NAME" >&2; exit 1 ;; esac
          have="$(node -p "require('./package.json').version")"
          code="$(node -p "require('fs').readFileSync('src/version.ts','utf8').split('\"')[1]")"
          if [ "$have" != "${GITHUB_REF_NAME#v}" ] || [ "$code" != "$have" ]; then
            echo "package.json is $have, src/version.ts is $code, the tag is $GITHUB_REF_NAME: all three must match." >&2
            exit 1
          fi
      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "@zebracat/sdk@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "@zebracat/sdk@${GITHUB_REF_NAME#v} is already on npm."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.published.outputs.skip != 'true'
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
